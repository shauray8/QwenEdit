<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mtedit playground</title>
<style>
  :root { --bg: #f6f5f2; --fg: #1d1d1b; --muted: #6b6a66; --line: #d9d6cf; --accent: #c2185b; --panel: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ecebe7; --muted: #9a9892; --line: #34332f; --panel: #1f1f1d; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  header { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .muted { color: var(--muted); }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=text] { flex: 1 1 320px; min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); font: inherit; }
  button { padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: progress; }
  .stage { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  canvas { display: block; width: 100%; height: auto; cursor: crosshair; touch-action: none; }
  .history { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .history figure { margin: 0; flex: 0 0 auto; width: 120px; cursor: pointer; border: 2px solid transparent; border-radius: 6px; padding: 2px; }
  .history figure.head { border-color: var(--accent); }
  .history img { width: 100%; display: block; border-radius: 4px; }
  .history figcaption { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<main>
  <header>
    <h1>mtedit playground</h1>
    <span class="muted" id="status">Upload an image to start a session.</span>
  </header>
  <div class="bar">
    <input type="file" id="file" accept="image/*">
    <label class="muted"><input type="checkbox" id="anchor"> anchor layout (keep the original as a reference)</label>
  </div>
  <div class="stage"><canvas id="canvas" width="1024" height="1024"></canvas></div>
  <div class="bar">
    <input type="text" id="instruction" placeholder="Describe the edit, e.g. add a red mug on the table in the box">
    <button class="primary" id="edit">Edit</button>
    <button id="reroll">Re-roll</button>
    <button id="undo">Undo</button>
    <button id="clear">Clear boxes</button>
  </div>
  <div class="muted">Drag on the image to draw edit boxes (optional). Everything outside the boxes is kept exactly.</div>
  <div class="history" id="history"></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const canvas = $("canvas"), ctx = canvas.getContext("2d");
let session = null, image = new Image(), boxes = [], drag = null;

function status(text) { $("status").textContent = text; }
function busy(on) { for (const id of ["edit", "reroll", "undo"]) $(id).disabled = on; }

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (image.complete && image.naturalWidth) ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
  ctx.lineWidth = Math.max(2, canvas.width / 300);
  ctx.strokeStyle = "#ff00ff";
  for (const [x0, y0, x1, y1] of boxes.concat(drag ? [drag] : [])) ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
}

function point(event) {
  const r = canvas.getBoundingClientRect();
  return [(event.clientX - r.left) * canvas.width / r.width, (event.clientY - r.top) * canvas.height / r.height];
}
canvas.addEventListener("pointerdown", (e) => { if (!session) return; const [x, y] = point(e); drag = [x, y, x, y]; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", (e) => { if (!drag) return; const [x, y] = point(e); drag[2] = x; drag[3] = y; draw(); });
canvas.addEventListener("pointerup", () => {
  if (!drag) return;
  const [a, b, c, d] = drag; drag = null;
  if (Math.abs(c - a) > 4 && Math.abs(d - b) > 4) boxes.push([Math.min(a, c), Math.min(b, d), Math.max(a, c), Math.max(b, d)]);
  draw();
});

function show(data) {
  session = data;
  canvas.width = data.size[0]; canvas.height = data.size[1];
  image = new Image();
  image.onload = draw;
  image.src = `/sessions/${data.id}/image/${data.head}?t=${Date.now()}`;
  const history = $("history"); history.replaceChildren();
  for (const [vid, v] of Object.entries(data.versions)) {
    const fig = document.createElement("figure");
    if (vid === data.head) fig.className = "head";
    const img = document.createElement("img"); img.src = `/sessions/${data.id}/image/${vid}`; img.alt = vid;
    const cap = document.createElement("figcaption"); cap.textContent = `${vid} ${v.instruction || "original"}`;
    fig.append(img, cap);
    fig.onclick = () => call(`/sessions/${data.id}/checkout`, { version: vid });
    history.append(fig);
  }
}

async function call(url, body) {
  busy(true);
  try {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    show(data);
    if (data.seconds) status(`${data.version} in ${data.seconds.toFixed(2)} s`);
  } catch (err) { status(`error: ${err.message}`); }
  finally { busy(false); }
}

$("file").addEventListener("change", async () => {
  const file = $("file").files[0]; if (!file) return;
  const form = new FormData(); form.append("image", file); form.append("layout", $("anchor").checked ? "anchor" : "chain");
  status("creating session...");
  const res = await fetch("/sessions", { method: "POST", body: form });
  boxes = []; show(await res.json()); status("Session ready. Draw boxes (optional) and describe an edit.");
});
$("edit").onclick = () => {
  const instruction = $("instruction").value.trim(); if (!session || !instruction) return;
  status("editing..."); const b = boxes; boxes = [];
  call(`/sessions/${session.id}/edit`, { instruction, boxes: b.length ? b : null });
};
$("reroll").onclick = () => session && (status("re-rolling..."), call(`/sessions/${session.id}/reroll`));
$("undo").onclick = () => session && call(`/sessions/${session.id}/undo`);
$("clear").onclick = () => { boxes = []; draw(); };
$("instruction").addEventListener("keydown", (e) => { if (e.key === "Enter") $("edit").click(); });
</script>
</body>
</html>
