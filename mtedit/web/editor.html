<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mtedit</title>
<style>
:root {
  --bg: #0d0d0f; --panel: #151518; --panel-2: #1c1c21; --line: #2a2a31; --line-2: #34343c;
  --fg: #ececf1; --muted: #9a9aa6; --dim: #6c6c78;
  --accent: #8b6cff; --accent-2: #a58bff; --accent-ink: #fff;
  --danger: #ff6b6b; --ok: #4fd18b;
  --radius: 12px; --shadow: 0 10px 40px rgba(0,0,0,.45);
  --font: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--font); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:disabled { opacity: .45; cursor: not-allowed; }
input, textarea, select { font: inherit; color: var(--fg); }
.app { display: grid; grid-template-rows: 52px 1fr; height: 100vh; }

/* header */
header { display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { font-weight: 650; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
.brand i { width: 18px; height: 18px; border-radius: 6px; background: conic-gradient(from 200deg, var(--accent), #ff7ab6, #ffd36b, var(--accent)); display: inline-block; }
.chip { padding: 3px 8px; border: 1px solid var(--line-2); border-radius: 999px; color: var(--muted); font-size: 12px; }
.seg { display: flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-left: auto; margin-right: auto; }
.seg button { padding: 5px 12px; border-radius: 7px; color: var(--muted); font-weight: 550; }
.seg button.on { background: var(--line-2); color: var(--fg); }
.seg button small { color: var(--dim); font-weight: 450; margin-left: 4px; }
.latency { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 88px; text-align: right; }
.latency b { color: var(--fg); font-weight: 600; }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.icon-btn:hover { background: var(--panel-2); color: var(--fg); }
.icon-btn.on { background: var(--accent); color: var(--accent-ink); }
svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* body */
.body { display: grid; grid-template-columns: 56px 1fr 300px; min-height: 0; }
.rail { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 6px; }
.rail .sep { width: 24px; height: 1px; background: var(--line); margin: 6px 0; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden;
  background: radial-gradient(circle at 1px 1px, #1d1d22 1px, transparent 0) 0 0 / 22px 22px, var(--bg); }
.frame { position: absolute; transform-origin: 0 0; user-select: none; }
.frame img { display: block; width: 100%; height: 100%; border-radius: 6px; box-shadow: var(--shadow); pointer-events: none; }
.overlay { position: absolute; inset: 0; cursor: crosshair; }
.box { position: absolute; border: 2px solid; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0,0,0,.35); }
.box.sel { box-shadow: 0 0 0 1px rgba(0,0,0,.35), 0 0 0 4px rgba(255,255,255,.12); }
.tag { position: absolute; left: -2px; bottom: calc(100% + 6px); display: flex; align-items: center; gap: 6px;
  background: rgba(14,14,17,.92); border: 1px solid var(--line-2); border-radius: 8px; padding: 4px 6px 4px 8px;
  backdrop-filter: blur(6px); box-shadow: var(--shadow); white-space: nowrap; }
.box.below .tag { bottom: auto; top: calc(100% + 6px); }
.tag .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.tag input { background: none; border: 0; outline: 0; width: 220px; padding: 2px 0; }
.tag input::placeholder { color: var(--dim); }
.tag button { color: var(--dim); width: 18px; height: 18px; display: grid; place-items: center; border-radius: 4px; }
.tag button:hover { color: var(--fg); background: var(--line-2); }
.tag .thumb { width: 22px; height: 22px; border-radius: 4px; object-fit: cover; flex: none; border: 1px solid var(--line-2); }
.box .obj { position: absolute; right: 4px; bottom: 4px; width: 30%; max-width: 72px; aspect-ratio: 1; object-fit: contain; border-radius: 6px;
  background: rgba(255,255,255,.92); box-shadow: var(--shadow); pointer-events: none; }
.box.dropping { outline: 2px dashed var(--accent); outline-offset: 3px; }
.handle { position: absolute; width: 10px; height: 10px; right: -6px; bottom: -6px; background: #fff; border-radius: 3px; cursor: nwse-resize; }

/* busy */
.busy { position: absolute; inset: 0; border-radius: 6px; overflow: hidden; pointer-events: none; display: none; }
.busy.on { display: block; }
.busy::before { content: ""; position: absolute; inset: -50%; background: linear-gradient(110deg, transparent 35%, rgba(139,108,255,.20) 50%, transparent 65%);
  animation: sweep 1.15s linear infinite; }
@keyframes sweep { from { transform: translateX(-35%); } to { transform: translateX(35%); } }
.busy span { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(14,14,17,.85); border: 1px solid var(--line-2);
  border-radius: 999px; padding: 5px 12px; font-variant-numeric: tabular-nums; }

/* empty state */
.empty { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); width: min(640px, calc(100% - 32px)); z-index: 15; }
.empty:not(.dim) { top: 50%; transform: translate(-50%, -50%); }
.start { width: 100%; background: rgba(22,22,27,.62); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  border: 1px solid var(--line-2); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); transition: opacity .15s; }
/* while editing: a small panel beside the rail, closed until the rail's create button opens it */
.empty.dim { display: none; left: 12px; top: 12px; transform: none; width: min(440px, calc(100% - 24px)); }
.empty.dim.open { display: block; }
.empty.dim .start { background: rgba(22,22,27,.92); }
.empty.dim .start p, .empty.dim .start h2 { display: none; }
.empty.dim textarea { min-height: 60px; }
.empty .hint { display: none; margin-top: 8px; color: var(--muted); font-size: 12px; }
.empty.dim .hint { display: block; }
.start.working { opacity: .5 !important; pointer-events: none; }
.aspects button { display: inline-flex; align-items: center; gap: 6px; }
.aspects svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.start h2 { margin: 0 0 4px; font-size: 18px; }
.start p { margin: 0 0 14px; color: var(--muted); }
.start textarea { width: 100%; min-height: 84px; resize: vertical; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: 0; }
.start textarea:focus { border-color: var(--accent); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.aspects button { padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); }
.aspects button.on { border-color: var(--accent); color: var(--fg); }
.primary { background: var(--accent); color: var(--accent-ink); padding: 8px 16px; border-radius: 10px; font-weight: 600; }
.primary:hover:not(:disabled) { background: var(--accent-2); }
.ghost { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-2); color: var(--fg); }
.ghost:hover:not(:disabled) { background: var(--panel-2); }
.drop { padding: 5px 10px; border: 1px dashed var(--line-2); border-radius: 8px; color: var(--muted); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.drop svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.drop.over { border-color: var(--accent); color: var(--fg); }

/* prompt dock */
.dock { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(760px, calc(100% - 32px)); display: none; }
.dock.on { display: block; }
.enhanced { background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; box-shadow: var(--shadow); display: none; }
.enhanced.on { display: block; }
.enhanced header { all: unset; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; color: var(--accent-2); font-weight: 600; }
.enhanced textarea { width: 100%; min-height: 70px; resize: vertical; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; outline: 0; }
.bar { display: flex; align-items: flex-end; gap: 8px; background: rgba(21,21,24,.94); border: 1px solid var(--line-2); border-radius: 14px; padding: 8px; box-shadow: var(--shadow); backdrop-filter: blur(8px); }
.bar textarea { flex: 1; resize: none; background: none; border: 0; outline: 0; padding: 7px 8px; max-height: 120px; min-height: 34px; }
.bar .boxes-chip { align-self: center; color: var(--muted); font-size: 12px; padding: 0 4px; white-space: nowrap; }

/* history */
aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
aside .head { display: flex; align-items: center; gap: 4px; padding: 10px 10px 10px 14px; border-bottom: 1px solid var(--line); }
aside .head h3 { margin: 0 auto 0 0; font-size: 13px; }
.versions { overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 0; flex: 1; }
.ver { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 6px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; text-align: left; }
.ver:hover { background: var(--panel-2); }
.ver.head-v { border-color: var(--accent); background: rgba(139,108,255,.08); }
.ver img { width: 64px; height: 64px; object-fit: cover; border-radius: 7px; background: var(--panel-2); }
.ver .t { font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ver .m { color: var(--dim); font-size: 11.5px; margin-top: 3px; font-variant-numeric: tabular-nums; }
.lastprompt { border-top: 1px solid var(--line); padding: 10px 14px; color: var(--muted); font-size: 12px; max-height: 160px; overflow-y: auto; }
.lastprompt b { color: var(--fg); font-weight: 600; display: block; margin-bottom: 4px; }

/* settings popover */
.pop { position: absolute; right: 12px; top: 56px; width: 280px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; padding: 12px; box-shadow: var(--shadow); z-index: 20; display: none; }
.pop.on { display: block; }
.pop label { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 0; color: var(--muted); }
.pop label span { color: var(--fg); }
.pop select, .pop input[type=number] { background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 4px 6px; width: 110px; }
.pop input[type=range] { width: 110px; accent-color: var(--accent); }
.pop input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }

.toast { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); background: #2a1416; border: 1px solid #6b2a2f; color: #ffd5d5; padding: 8px 14px; border-radius: 10px; display: none; z-index: 50; max-width: 80vw; }
.toast.on { display: block; }
.kbd { font-size: 11px; color: var(--dim); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 4px; margin-left: 6px; }
.compare-flag { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(14,14,17,.85); border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 10px; display: none; }
.compare-flag.on { display: block; }
.fetch-pill { position: absolute; top: 12px; right: 14px; background: rgba(14,14,17,.85); border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 10px; font-variant-numeric: tabular-nums; color: var(--muted); display: none; }
.fetch-pill.on { display: block; }
@media (max-width: 900px) { .body { grid-template-columns: 48px 1fr; } aside { display: none; } .seg button small { display: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><i></i>mtedit</div>
    <span class="chip" id="model">…</span>
    <div class="seg" id="speed">
      <button data-v="quality" class="on">Quality<small>8</small></button>
      <button data-v="fast">Fast<small>5</small></button>
      <button data-v="draft">Draft<small>4</small></button>
    </div>
    <div class="latency" id="latency"></div>
    <button class="icon-btn" id="settingsBtn" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>

  <div class="body">
    <nav class="rail">
      <button class="icon-btn on" id="toolBox" title="Box tool (B)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="3 2.5"/></svg></button>
      <button class="icon-btn" id="clearBoxes" title="Clear boxes (Esc)"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
      <div class="sep"></div>
      <button class="icon-btn" id="compareBtn" title="Hold to compare with the previous version (Space)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14"/></svg></button>
      <button class="icon-btn" id="newBtn" title="Create an image from text"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <a class="icon-btn" id="download" title="Download current" download><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></a>
    </nav>

    <main class="stage" id="stage">
      <div class="empty" id="empty">
        <div class="start">
          <h2>Start with an image</h2>
          <p>Generate one, or drop a photo anywhere.</p>
          <textarea id="genPrompt" placeholder="A sunlit reading nook with a green velvet armchair, photorealistic"></textarea>
          <div class="row" style="margin-top:10px">
            <div class="row aspects" id="aspects"></div>
            <label class="drop" id="drop" title="Upload or drop an image"><svg viewBox="0 0 24 24"><path d="M12 16V5M7 10l5-5 5 5M5 19h14"/></svg>Upload<input type="file" id="file" accept="image/*" hidden></label>
            <span style="flex:1"></span>
            <button class="primary" id="genBtn">Generate</button>
          </div>
          <div class="hint" id="genHint">Opens as a new image. Select a box first to use the result as its item.</div>
        </div>
      </div>
      <div class="frame" id="frame" hidden>
        <img id="img" alt="">
        <div class="overlay" id="overlay"></div>
        <div class="busy" id="busy"><span id="busyText"></span></div>
      </div>
      <div class="compare-flag" id="compareFlag">previous version</div>
      <div class="fetch-pill" id="fetchPill"></div>
      <div class="dock" id="dock">
        <div class="enhanced" id="enhanced">
          <header>✨ Enhanced prompt <span style="flex:1"></span><button class="icon-btn" id="dropEnhanced" title="Discard"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
          <textarea id="enhancedText"></textarea>
        </div>
        <div class="bar">
          <textarea id="prompt" rows="1" placeholder="Describe an edit to the whole image…"></textarea>
          <span class="boxes-chip" id="boxesChip"></span>
          <button class="ghost" id="enhanceBtn" title="Rewrite with Qwen-Image-2.1-PE-I2I">✨ Enhance</button>
          <button class="primary" id="editBtn">Edit<span class="kbd" style="color:#e9e3ff;border-color:#b9a8ff">⏎</span></button>
        </div>
      </div>
    </main>

    <aside>
      <div class="head">
        <h3>History</h3>
        <button class="icon-btn" id="rerollBtn" title="Re-roll (R)"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
        <button class="icon-btn" id="undoBtn" title="Undo (⌘Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      </div>
      <div class="versions" id="versions"></div>
      <div class="lastprompt" id="lastprompt" hidden></div>
    </aside>
  </div>
</div>

<div class="pop" id="settings">
  <label>Resolution (new images) <select id="optRes"><option value="1k">1K · fast</option><option value="1.5k">1.5K</option><option value="2k" selected>2K · native</option></select></label>
  <label>Reference detail <select id="optRef"><option value="full">Full</option><option value="1.5k" selected>1.5K · faster</option><option value="1k">1K · fastest</option></select></label>
  <label>Crop boxed edits <input type="checkbox" id="optCrop" checked></label>
  <label>DiT attention <select id="optAttn"></select></label>
  <label>Progressive (2K) <input type="checkbox" id="optProg" checked></label>
  <label>Edge feather <input type="range" id="optFeather" min="0" max="96" step="8" value="48"></label>
  <label>Seed <input type="number" id="optSeed" placeholder="random"></label>
  <label>Follow-up context <input type="checkbox" id="optContext" checked></label>
  <label>Enhancer thinking <input type="checkbox" id="optThink"></label>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const S = { config: null, session: null, boxes: [], sel: -1, speed: "quality", busy: false, aspect: "1:1", scale: 1, compare: false };
const rgb = (c) => `rgb(${c[0]},${c[1]},${c[2]})`;

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 4200); }
async function api(path, body, opts = {}) {
  const res = await fetch(path, body instanceof FormData ? { method: "POST", body } :
    body !== undefined ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (!res.ok) { let msg = await res.text(); try { msg = JSON.parse(msg).detail || msg; } catch {} throw new Error(msg); }
  return res.json();
}

// ---- busy state with a live timer
function busy(on, label = "Editing") {
  S.busy = on;
  for (const id of ["editBtn", "rerollBtn", "undoBtn", "genBtn", "enhanceBtn"]) $(id).disabled = on || (id === "enhanceBtn" && !S.config?.enhancer);
  $("busy").classList.toggle("on", on);
  clearInterval(S._timer);
  if (on) { const t0 = performance.now(); const tick = () => $("busyText").textContent = `${label} · ${((performance.now() - t0) / 1000).toFixed(1)}s`; tick(); S._timer = setInterval(tick, 100); }
}

// ---- layout: fit the image in the stage above the dock
function layout() {
  if (!S.session) return;
  const stage = $("stage").getBoundingClientRect(), [w, h] = S.session.size;
  const padX = 28, padTop = 28, padBottom = 120;
  const scale = Math.min((stage.width - 2 * padX) / w, (stage.height - padTop - padBottom) / h, 1.5);
  S.scale = scale;
  const f = $("frame");
  f.style.width = `${w * scale}px`; f.style.height = `${h * scale}px`;
  f.style.left = `${(stage.width - w * scale) / 2}px`; f.style.top = `${padTop + (stage.height - padTop - padBottom - h * scale) / 2}px`;
  renderBoxes();
}
window.addEventListener("resize", layout);

// ---- boxes
function color(i) { return S.config.palette[i % S.config.palette.length]; }
function renderBoxes() {
  const ov = $("overlay"); ov.replaceChildren();
  S.boxes.forEach((b, i) => {
    const c = color(i), el = document.createElement("div");
    el.className = "box" + (i === S.sel ? " sel" : "") + (b.box[1] * S.scale < 46 ? " below" : "");
    el.style.borderColor = rgb(c.rgb);
    el.style.left = `${b.box[0] * S.scale}px`; el.style.top = `${b.box[1] * S.scale}px`;
    el.style.width = `${(b.box[2] - b.box[0]) * S.scale}px`; el.style.height = `${(b.box[3] - b.box[1]) * S.scale}px`;
    const tag = document.createElement("div"); tag.className = "tag";
    const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = rgb(c.rgb);
    const input = document.createElement("input"); input.value = b.label; input.placeholder = b.ref ? "Place / wear this item… (optional detail)" : "What goes here?";
    input.addEventListener("input", () => { b.label = input.value; updateChip(); });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); $("prompt").focus(); } e.stopPropagation(); });
    input.addEventListener("pointerdown", (e) => e.stopPropagation());
    const del = document.createElement("button"); del.title = "Remove box"; del.innerHTML = '<svg viewBox="0 0 24 24" style="width:12px;height:12px"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    del.addEventListener("pointerdown", (e) => e.stopPropagation());
    del.onclick = () => { S.boxes.splice(i, 1); S.sel = -1; renderBoxes(); updateChip(); };
    const attach = document.createElement("button"); attach.title = "Attach an item image (or drop / paste one onto the box)";
    attach.innerHTML = '<svg viewBox="0 0 24 24" style="width:13px;height:13px"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>';
    attach.addEventListener("pointerdown", (e) => e.stopPropagation());
    attach.onclick = () => pickObject(i);
    if (b.ref) {
      const th = document.createElement("img"); th.className = "thumb"; th.src = b.ref; th.title = "Attached item (click to remove)";
      th.addEventListener("pointerdown", (e) => e.stopPropagation());
      th.onclick = () => { delete b.ref; renderBoxes(); };
      const big = document.createElement("img"); big.className = "obj"; big.src = b.ref; el.append(big);
      tag.append(dot, th, input, attach, del);
    } else tag.append(dot, input, attach, del);
    el.addEventListener("dragover", (e) => { e.preventDefault(); e.stopPropagation(); el.classList.add("dropping"); });
    el.addEventListener("dragleave", () => el.classList.remove("dropping"));
    el.addEventListener("drop", (e) => { e.preventDefault(); e.stopPropagation(); el.classList.remove("dropping");
      const f = e.dataTransfer.files[0]; if (f) attachObject(i, f); });
    const handle = document.createElement("div"); handle.className = "handle";
    handle.addEventListener("pointerdown", (e) => { e.stopPropagation(); startDrag(e, i, "resize"); });
    el.addEventListener("pointerdown", (e) => { if (e.target === el) { e.stopPropagation(); S.sel = i; startDrag(e, i, "move"); } });
    el.append(tag, handle); ov.append(el);
    if (b._focus) { delete b._focus; requestAnimationFrame(() => input.focus()); }
  });
  updateChip();
}
function updateChip() {
  const n = S.boxes.length;
  $("boxesChip").textContent = n ? `${n} box${n > 1 ? "es" : ""}` : "";
  $("prompt").placeholder = n ? "Optional: extra instruction, or what to do in unlabeled boxes…" : "Describe an edit to the whole image…";
}
// ---- item references on boxes: shrunk client-side (the tunnel is slow); the server places them at ~640 px
function shrinkImage(file, max = 1024) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve({ data: c.toDataURL("image/jpeg", 0.92), w: img.width, h: img.height });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("not an image")); };
    img.src = url;
  });
}
async function attachObject(i, file) {
  if (!file || !file.type.startsWith("image/")) return toast("Drop an image file.");
  const b = S.boxes[i]; if (!b) return;
  b.ref = (await shrinkImage(file)).data; S.sel = i; renderBoxes();
}
function pickObject(i) {
  const f = document.createElement("input"); f.type = "file"; f.accept = "image/*";
  f.onchange = () => f.files[0] && attachObject(i, f.files[0]); f.click();
}
// dropping an item image on the canvas (not on a box) makes a box there, sized to the item's aspect
async function dropObjectAt(e, file) {
  if (S.boxes.length >= S.config.palette.length) return toast(`At most ${S.config.palette.length} boxes per edit.`);
  const { data, w, h } = await shrinkImage(file), p = imagePoint(e), [W, H] = S.session.size;
  const side = 0.28 * Math.min(W, H), bw = w >= h ? side : side * w / h, bh = w >= h ? side * h / w : side;
  const x0 = Math.max(0, Math.min(W - bw, p[0] - bw / 2)), y0 = Math.max(0, Math.min(H - bh, p[1] - bh / 2));
  S.boxes.push({ box: [x0, y0, x0 + bw, y0 + bh], label: "", ref: data, _focus: true }); S.sel = S.boxes.length - 1; renderBoxes();
}
function imagePoint(e) {
  const r = $("overlay").getBoundingClientRect(), [w, h] = S.session.size;
  return [Math.max(0, Math.min(w, (e.clientX - r.left) / S.scale)), Math.max(0, Math.min(h, (e.clientY - r.top) / S.scale))];
}
function startDrag(e, i, mode) {
  const p0 = imagePoint(e), b = S.boxes[i], start = [...b.box];
  const move = (ev) => {
    const [x, y] = imagePoint(ev), dx = x - p0[0], dy = y - p0[1], [w, h] = S.session.size;
    if (mode === "move") {
      const bw = start[2] - start[0], bh = start[3] - start[1];
      const nx = Math.max(0, Math.min(w - bw, start[0] + dx)), ny = Math.max(0, Math.min(h - bh, start[1] + dy));
      b.box = [nx, ny, nx + bw, ny + bh];
    } else b.box = [start[0], start[1], Math.max(start[0] + 16, Math.min(w, start[2] + dx)), Math.max(start[1] + 16, Math.min(h, start[3] + dy))];
    renderBoxes();
  };
  const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
}
$("overlay").addEventListener("pointerdown", (e) => {
  if (!S.session || S.busy || S.compare) return;
  if (S.boxes.length >= S.config.palette.length) return toast(`At most ${S.config.palette.length} boxes per edit.`);
  const p0 = imagePoint(e), b = { box: [p0[0], p0[1], p0[0], p0[1]], label: "" };
  S.boxes.push(b); S.sel = S.boxes.length - 1;
  const move = (ev) => { const p = imagePoint(ev); b.box = [Math.min(p0[0], p[0]), Math.min(p0[1], p[1]), Math.max(p0[0], p[0]), Math.max(p0[1], p[1])]; renderBoxes(); };
  const up = () => {
    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
    if (b.box[2] - b.box[0] < 12 || b.box[3] - b.box[1] < 12) { S.boxes.pop(); S.sel = -1; } else b._focus = true;
    renderBoxes();
  };
  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
});

// ---- session view
function summary(v) {
  if (v.regions && v.regions.length) return v.regions.map((r) => r[1]).join(" · ") + (v.instruction ? ` · ${v.instruction}` : "");
  return v.instruction || "Original";
}
function show(data, { keepBoxes = false } = {}) {
  S.session = data;
  $("empty").classList.add("dim"); $("empty").classList.remove("open"); $("newBtn").classList.remove("on"); $("frame").hidden = false; $("dock").classList.add("on");
  const head = data.versions[data.head];
  // the preview that came with the response shows at once; the full-resolution PNG follows
  S.previews = S.previews || {};
  if (data.preview) S.previews[S.session.id+"/"+data.head] = data.preview;
  $("img").src = S.previews[S.session.id+"/"+data.head] || imageUrl(data.head, 1280);
  fetchFull(data.head);
  $("download").href = imageUrl(data.head); $("download").setAttribute("download", `${data.id}_${data.head}.png`);
  if (!keepBoxes) { S.boxes = []; S.sel = -1; }
  layout();
  showLatency();
  const list = $("versions"); list.replaceChildren();
  [...data.order].reverse().forEach((vid) => {
    const v = data.versions[vid], el = document.createElement("button");
    el.className = "ver" + (vid === data.head ? " head-v" : "");
    const meta = [vid, v.seconds ? `${v.seconds.toFixed(2)}s` : null, v.parent && v.parent !== prevOf(data, vid) ? `from ${v.parent}` : null].filter(Boolean).join(" · ");
    el.innerHTML = `<img loading="lazy" src="${imageUrl(vid, 160)}" alt=""><div><div class="t"></div><div class="m">${meta}</div></div>`;
    el.querySelector(".t").textContent = summary(v);
    el.onclick = () => run(() => api(`/api/sessions/${data.id}/checkout`, { version: vid }), null);
    list.append(el);
  });
  const lp = $("lastprompt");
  if (head.prompt) {
    lp.hidden = false; lp.innerHTML = "<b>Prompt sent</b>"; lp.append(document.createTextNode(head.prompt));
    const r = head.resolved;
    if (r && r.mode) { const d = document.createElement("div"); d.style.marginTop = "6px"; d.textContent = `context: ${r.mode}${r.target ? ` · refers to edit ${r.target}` : ""} · ${(r.seconds * 1000).toFixed(0)} ms`; lp.append(d); }
  } else lp.hidden = true;
}
function prevOf(data, vid) { const i = data.order.indexOf(vid); return i > 0 ? data.order[i - 1] : null; }
function imageUrl(vid, w) { return `/api/sessions/${S.session.id}/image/${vid}${w ? `?w=${w}` : ""}`; }
function canvasUrl(vid) { return (S.full && S.full[S.session.id+"/"+vid]) || (S.previews && S.previews[S.session.id+"/"+vid]) || imageUrl(vid, 1280); }
function fetchFull(vid) {
  S.full = S.full || {};
  if (S.full[S.session.id+"/"+vid]) { $("img").src = S.full[S.session.id+"/"+vid]; return; }
  const t0 = performance.now(), url = imageUrl(vid), pill = $("fetchPill");
  pill.classList.add("on");
  clearInterval(S._fetchTimer);
  const tick = () => pill.textContent = `Fetching full image · ${((performance.now() - t0) / 1000).toFixed(1)}s`;
  tick(); S._fetchTimer = setInterval(tick, 100);
  const img = new Image();
  img.onload = () => {
    S.full[S.session.id+"/"+vid] = url; clearInterval(S._fetchTimer); pill.classList.remove("on");
    if (S.session?.head === vid && !S.compare) $("img").src = url;
    if (S._t0 && S._lastVid === vid) { S.totalSec = (performance.now() - S._t0) / 1000; showLatency(); S._t0 = null; }
  };
  img.onerror = () => { clearInterval(S._fetchTimer); pill.classList.remove("on"); };
  img.src = url;
}
function showLatency() {
  const head = S.session?.versions[S.session.head];
  if (!head || !head.seconds) { $("latency").innerHTML = ""; return; }
  $("latency").innerHTML = `<b>${head.seconds.toFixed(2)}s</b> generate` + (S.totalSec ? ` · <b>${S.totalSec.toFixed(1)}s</b> total` : "");
}

async function run(fn, label = "Editing") {
  if (S.busy) return;
  if (label) busy(true, label);
  try { const data = await fn(); if (data) show(data); return data; }
  catch (err) { toast(err.message); }
  finally { if (label) busy(false); }
}
function common() {
  const seed = $("optSeed").value;
  return { speed: S.speed, progressive: $("optProg").checked, ref: $("optRef").value, context: $("optContext").checked, crop: $("optCrop").checked, attention: $("optAttn").value, feather: +$("optFeather").value, seed: seed === "" ? null : +seed };
}
async function doEdit() {
  if (!S.session) return;
  const instruction = $("prompt").value.trim(), useEnhanced = $("enhanced").classList.contains("on");
  const regions = S.boxes.map((b) => ({ box: b.box.map(Math.round), label: b.label.trim(), ...(b.ref ? { ref: b.ref } : {}) }));
  if (!instruction && !regions.length && !useEnhanced) return toast("Describe an edit, or draw and label boxes.");
  const body = { instruction, regions, ...common() };
  if (useEnhanced) body.raw_prompt = $("enhancedText").value.trim();
  S._t0 = performance.now(); S.totalSec = null;
  const data = await run(() => api(`/api/sessions/${S.session.id}/edit`, body), "Generating");
  if (data) S._lastVid = data.head;
  if (data) { $("prompt").value = ""; autosize(); $("enhanced").classList.remove("on"); }
}
async function doEnhance() {
  if (!S.session || !S.config.enhancer) return;
  const body = { instruction: $("prompt").value.trim(), regions: S.boxes.map((b) => ({ box: b.box.map(Math.round), label: b.label.trim() })), thinking: $("optThink").checked };
  busy(true, "Enhancing");
  try {
    const r = await api(`/api/sessions/${S.session.id}/enhance`, body);
    $("enhancedText").value = r.prompt; $("enhanced").classList.add("on");
    $("latency").innerHTML = `<b>${r.seconds.toFixed(1)}s</b> enhance`;
  } catch (err) { toast(err.message); } finally { busy(false); }
}

// ---- start: generate / upload
async function generate() {
  const prompt = $("genPrompt").value.trim(); if (!prompt) return toast("Write a prompt to generate an image.");
  const seed = $("optSeed").value;
  const target = S.session && S.sel >= 0 ? S.sel : -1;  // a selected box: the image becomes its item
  if (target < 0) busy(true, "Generating");
  $("empty").querySelector(".start").classList.add("working");
  try {
    const g = await api("/api/generate", { prompt, aspect: S.aspect, resolution: target >= 0 ? "1k" : $("optRes").value, seed: seed === "" ? null : +seed });
    if (target >= 0) {
      const blob = await (await fetch(`/api/sessions/${g.id}/image/${g.head}`)).blob();
      await attachObject(target, new File([blob], "item.png", { type: blob.type || "image/png" }));
    } else show(g);
    $("empty").classList.remove("open"); $("newBtn").classList.remove("on");
  }
  catch (err) { toast(err.message); } finally { busy(false); $("empty").querySelector(".start").classList.remove("working"); }
}
async function upload(file) {
  if (!file) return;
  const form = new FormData(); form.append("image", file);
  $("empty").querySelector(".start").classList.add("working");
  try { show(await api(`/api/sessions?resolution=${$("optRes").value}`, form)); } catch (err) { toast(err.message); }
  finally { $("empty").querySelector(".start").classList.remove("working"); }
}

// ---- compare (hold)
function compare(on) {
  if (!S.session) return;
  const head = S.session.versions[S.session.head];
  if (on && !head.parent) return;
  S.compare = on;
  $("img").src = canvasUrl(on ? head.parent : S.session.head);
  $("overlay").style.visibility = on ? "hidden" : "visible";
  $("compareFlag").classList.toggle("on", on); $("compareBtn").classList.toggle("on", on);
}

// ---- wiring
function autosize() { const t = $("prompt"); t.style.height = "auto"; t.style.height = `${Math.min(120, t.scrollHeight)}px`; }
$("prompt").addEventListener("input", autosize);
$("prompt").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); doEdit(); } });
$("editBtn").onclick = doEdit;
$("enhanceBtn").onclick = doEnhance;
$("dropEnhanced").onclick = () => $("enhanced").classList.remove("on");
$("rerollBtn").onclick = () => { if (!S.session) return; S._t0 = performance.now(); S.totalSec = null;
  run(() => api(`/api/sessions/${S.session.id}/reroll`, common()), "Generating").then((d) => { if (d) S._lastVid = d.head; }); };
$("undoBtn").onclick = () => S.session && run(() => api(`/api/sessions/${S.session.id}/undo`, {}), null);
$("clearBoxes").onclick = () => { S.boxes = []; S.sel = -1; renderBoxes(); };
$("newBtn").onclick = () => {
  if (!S.session) return $("genPrompt").focus();
  const open = $("empty").classList.toggle("open"); $("newBtn").classList.toggle("on", open);
  if (open) { $("genHint").textContent = S.sel >= 0 ? "Will become the selected box's item (1K)." : "Opens as a new image. Select a box first to use the result as its item.";
    $("genPrompt").focus(); }
};
$("genBtn").onclick = generate;
$("genPrompt").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) generate(); });
$("file").addEventListener("change", () => upload($("file").files[0]));
for (const ev of ["dragover", "dragenter"]) document.addEventListener(ev, (e) => { e.preventDefault(); $("drop").classList.add("over"); });
document.addEventListener("dragleave", () => $("drop").classList.remove("over"));
document.addEventListener("drop", (e) => { e.preventDefault(); $("drop").classList.remove("over");
  const f = e.dataTransfer.files[0];
  if (f && S.session && !$("frame").hidden && $("frame").contains(e.target)) return dropObjectAt(e, f);
  upload(f); });
// paste an image: onto the selected box as its item, else (no session) as a new image
document.addEventListener("paste", (e) => {
  const item = [...(e.clipboardData?.items || [])].find((it) => it.type.startsWith("image/"));
  if (!item) return;
  e.preventDefault();
  if (S.session && S.sel >= 0) attachObject(S.sel, item.getAsFile()); else if (!S.session) upload(item.getAsFile());
});
$("compareBtn").addEventListener("pointerdown", () => compare(true));
for (const ev of ["pointerup", "pointerleave"]) $("compareBtn").addEventListener(ev, () => S.compare && compare(false));
$("settingsBtn").onclick = (e) => { e.stopPropagation(); $("settings").classList.toggle("on"); };
document.addEventListener("click", (e) => { if (!$("settings").contains(e.target)) $("settings").classList.remove("on"); });
$("speed").querySelectorAll("button").forEach((b) => b.onclick = () => {
  S.speed = b.dataset.v; $("speed").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
});
document.addEventListener("keydown", (e) => {
  const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName);
  if (e.key === " " && !typing && !e.repeat) { e.preventDefault(); compare(true); return; }
  if (typing) return;
  if ((e.metaKey || e.ctrlKey) && e.key === "z") { e.preventDefault(); $("undoBtn").click(); }
  else if (e.key === "r" || e.key === "R") $("rerollBtn").click();
  else if (e.key === "Escape" && $("empty").classList.contains("open")) { $("empty").classList.remove("open"); $("newBtn").classList.remove("on"); }
  else if (e.key === "Escape") $("clearBoxes").click();
  else if ((e.key === "Backspace" || e.key === "Delete") && S.sel >= 0) { S.boxes.splice(S.sel, 1); S.sel = -1; renderBoxes(); }
  else if (e.key === "b" || e.key === "B") $("prompt").blur();
});
document.addEventListener("keyup", (e) => { if (e.key === " " && S.compare) compare(false); });

(async () => {
  S.config = await api("/api/config");
  $("model").textContent = S.config.model.split("/").pop();
  $("optAttn").innerHTML = S.config.attentions.map((a) => `<option value="${a}">${a === "sdpa" ? "SDPA (bf16)" : a === "sage2" ? "Sage2 (int8/fp8)" : "Sage3 (fp4)"}</option>`).join("");
  if (S.config.attentions.includes("sage2")) $("optAttn").value = "sage2";  // −10% per edit, visually identical
  $("enhanceBtn").disabled = !S.config.enhancer;
  if (!S.config.enhancer) $("enhanceBtn").title = "Start the server with --enhancer-url to enable";
  const asp = $("aspects");
  for (const a of Object.keys(S.config.aspects)) {
    const b = document.createElement("button"); if (a === S.aspect) b.className = "on";
    const [rw, rh] = a.split(":").map(Number), k = 14 / Math.max(rw, rh), w = rw * k, h = rh * k;
    b.innerHTML = `<svg viewBox="0 0 16 16"><rect x="${(16 - w) / 2}" y="${(16 - h) / 2}" width="${w}" height="${h}" rx="1.5"/></svg>${a}`;
    b.onclick = () => { S.aspect = a; asp.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); };
    asp.append(b);
  }
})();
</script>
</body>
